<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Événements - Super Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1565c0;
      --primary-dark: #0a3d6b;
      --accent: #c9a227;
      --success: #4caf50;
      --warning: #ff9800;
      --danger: #f44336;
      --light: #f8fafc;
      --dark: #2c3e50;
    }

    [data-theme="dark"] {
      --bg-primary: #1a1a1a;
      --bg-secondary: #2d2d2d;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
    }

    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --text-primary: #333;
      --text-secondary: #666;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .page-header {
      margin-bottom: 2rem;
    }

    .page-header h1 {
      color: var(--primary);
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }

    .page-header p {
      color: var(--text-secondary);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .event-card {
      background: var(--bg-primary);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-left: 4px solid var(--primary);
    }

    .event-card h3 {
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .event-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
      font-size: 0.9rem;
    }

    .event-meta-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-secondary);
    }

    .event-meta-item i {
      color: var(--primary);
      min-width: 20px;
    }

    .status-badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-scheduled {
      background: #e3f2fd;
      color: #1565c0;
    }

    .status-ongoing {
      background: #fff3e0;
      color: #f57c00;
    }

    .status-completed {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .event-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .btn-sm {
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
    }

    .btn-edit {
      background: var(--primary);
      color: white;
    }

    .btn-delete {
      background: var(--danger);
      color: white;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--bg-primary);
      padding: 2rem;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      margin-top: 2rem;
    }

    .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #4caf50;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 3rem;
      color: var(--primary);
      margin-bottom: 1rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- PAGE HEADER -->
    <div class="page-header">
      <h1><i class="fas fa-calendar-alt"></i> Gestion des Événements</h1>
      <p>Créer et gérer les événements et services</p>
    </div>

    <!-- ALERTS -->
    <div class="alert alert-success" id="success-alert"></div>
    <div class="alert alert-danger" id="error-alert"></div>

    <!-- CONTROLS -->
    <div class="controls">
      <div class="search-box">
        <input 
          type="text" 
          id="search-input" 
          placeholder="🔍 Rechercher un événement..."
        >
      </div>
      <button class="btn btn-primary" id="btn-add-event">
        <i class="fas fa-plus"></i> Nouvel Événement
      </button>
    </div>

    <!-- EVENTS LIST -->
    <div id="events-container">
      <!-- Événements chargés dynamiquement -->
    </div>

    <div class="empty-state" id="empty-state" style="display: none;">
      <i class="fas fa-inbox"></i>
      <h3>Aucun événement trouvé</h3>
      <p>Créez votre premier événement en cliquant sur "Nouvel Événement"</p>
    </div>
  </div>

  <!-- MODAL: Add/Edit Event -->
  <div class="modal" id="event-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Ajouter un Événement</h2>
      </div>
      <form id="event-form">
        <div class="form-group">
          <label for="title">Titre *</label>
          <input type="text" id="title" name="title" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">Date *</label>
            <input type="datetime-local" id="date" name="date" required>
          </div>
          <div class="form-group">
            <label for="end_date">Date de fin</label>
            <input type="datetime-local" id="end_date" name="end_date">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category">Catégorie</label>
            <select id="category" name="category">
              <option value="service">Service religieux</option>
              <option value="celebration">Célébration</option>
              <option value="seminar">Séminaire</option>
              <option value="workshop">Atelier</option>
              <option value="other">Autre</option>
            </select>
          </div>
          <div class="form-group">
            <label for="status">Statut</label>
            <select id="status" name="status">
              <option value="scheduled">Prévu</option>
              <option value="ongoing">En cours</option>
              <option value="completed">Terminé</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="location">Lieu</label>
          <input type="text" id="location" name="location">
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description"></textarea>
        </div>

        <div class="form-group">
          <label for="max_attendees">Nombre max de participants</label>
          <input type="number" id="max_attendees" name="max_attendees" min="0">
        </div>

        <div class="form-actions">
          <button type="button" class="btn" style="background: #999; color: white;" onclick="document.getElementById('event-modal').classList.remove('show')">
            Annuler
          </button>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Enregistrer
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="supabase-client-adapted.js"></script>
  <script>
    'use strict';

    // Check authentication
    var adminEmail = sessionStorage.getItem('super_admin_email');
    var adminToken = sessionStorage.getItem('super_admin_token');
    if (!adminEmail || !adminToken) {
      window.location.href = 'login.html';
    }

    // Data - Chargé depuis Supabase
    var events = [];
    var allEvents = [];
    var filteredEvents = [];
    var editingId = null;

    const form = document.getElementById('event-form');
    const modal = document.getElementById('event-modal');
    const searchInput = document.getElementById('search-input');
    const btnAdd = document.getElementById('btn-add-event');
    const container = document.getElementById('events-container');
    const emptyState = document.getElementById('empty-state');

    btnAdd.addEventListener('click', openAddModal);
    searchInput.addEventListener('keyup', applyFilters);
    form.addEventListener('submit', saveEvent);

    window.addEventListener('load', function() {
      console.log('⏳ Chargement des événements depuis Supabase...');
      loadEventsFromSupabase();
    });

    /**
     * Charge les événements depuis Supabase
     * ⚠️ NOTE: Le champ est "desc" pas "description"
     */
    function loadEventsFromSupabase() {
      supabase.getEvenements()
        .then(function(data) {
          console.log('✅ Événements chargés:', data);
          allEvents = data || [];
          events = [...allEvents];
          filteredEvents = [...allEvents];
          renderEvents();
        })
        .catch(function(error) {
          console.error('❌ Erreur chargement:', error);
          showError('Erreur lors du chargement des événements: ' + error.message);
        });
    }

    function renderEvents() {
      if (filteredEvents.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      container.innerHTML = filteredEvents.map(e => `
        <div class="event-card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
              <h3>${escapeHtml(e.titre || '')}</h3>
              <span class="status-badge status-scheduled">
                ✓ Événement
              </span>
            </div>
          </div>
          
          <div class="event-meta">
            <div class="event-meta-item">
              <i class="fas fa-calendar"></i>
              <span>${formatDate(e.date)}</span>
            </div>
            <div class="event-meta-item">
              <i class="fas fa-align-left"></i>
              <span>${escapeHtml((e.desc || '').substring(0, 50))}...</span>
            </div>
          </div>

          <p style="margin: 1rem 0; color: var(--text-secondary);">
            ${escapeHtml(e.desc || '')}
          </p>

          <div class="event-actions">
            <button class="btn btn-sm btn-edit" onclick="editEvent(${e.id})">
              <i class="fas fa-edit"></i> Modifier
            </button>
            <button class="btn btn-sm btn-delete" onclick="deleteEvent(${e.id})">
              <i class="fas fa-trash"></i> Supprimer
            </button>
          </div>
        </div>
      `).join('');
    }
              <i class="fas fa-map-marker-alt"></i>
              <span>${escapeHtml(e.location)}</span>
            </div>
            <div class="event-meta-item">
              <i class="fas fa-users"></i>
              <span>${e.attendees} participants</span>
            </div>
            <div class="event-meta-item">
              <i class="fas fa-tag"></i>
              <span>${getCategoryLabel(e.category)}</span>
            </div>
          </div>

          <p style="margin: 1rem 0; color: var(--text-secondary);">${escapeHtml(e.description)}</p>

          <div class="event-actions">
            <button class="btn btn-sm btn-edit" onclick="editEvent(${e.id})">
              <i class="fas fa-edit"></i> Modifier
            </button>
            <button class="btn btn-sm btn-delete" onclick="deleteEvent(${e.id})">
              <i class="fas fa-trash"></i> Supprimer
            </button>
          </div>
        </div>
      `).join('');
    }

    function applyFilters() {
      const search = searchInput.value.toLowerCase();
      filteredEvents = events.filter(e => 
        (e.titre || '').toLowerCase().includes(search) ||
        (e.desc || '').toLowerCase().includes(search)
      );
      renderEvents();
    }

    function openAddModal() {
      editingId = null;
      document.getElementById('modal-title').textContent = 'Ajouter un Événement';
      form.reset();
      modal.classList.add('show');
    }

    function editEvent(id) {
      const evt = events.find(e => e.id === id);
      if (!evt) return;

      editingId = id;
      document.getElementById('modal-title').textContent = 'Modifier l\'Événement';
      document.getElementById('title').value = evt.titre || '';
      document.getElementById('date').value = formatDateForInput(evt.date);
      document.getElementById('category').value = 'service';
      document.getElementById('location').value = '';
      document.getElementById('description').value = evt.desc || ''; // ⚠️ Utiliser "desc"
      document.getElementById('status').value = 'scheduled';
      modal.classList.add('show');
    }

    function deleteEvent(id) {
      if (!confirm('Êtes-vous sûr de vouloir supprimer cet événement ?')) return;
      
      supabase.deleteEvenement(id)
        .then(function() {
          console.log('✅ Événement supprimé');
          loadEventsFromSupabase();
          showSuccess('Événement supprimé avec succès');
        })
        .catch(function(error) {
          console.error('❌ Erreur suppression:', error);
          showError('Erreur lors de la suppression: ' + error.message);
        });
    }

    function saveEvent(e) {
      e.preventDefault();

      const titre = document.getElementById('title').value.trim();
      const desc = document.getElementById('description').value.trim();
      const date = document.getElementById('date').value;

      if (!titre) {
        showError('Le titre est requis');
        return;
      }

      if (editingId) {
        // Modifier
        supabase.updateEvenement(editingId, {
          titre,
          desc,
          date: supabase.formatDate(new Date(date))
        })
          .then(function() {
            console.log('✅ Événement modifié');
            modal.classList.remove('show');
            form.reset();
            loadEventsFromSupabase();
            showSuccess('Événement modifié avec succès');
          })
          .catch(function(error) {
            console.error('❌ Erreur modification:', error);
            showError('Erreur lors de la modification: ' + error.message);
          });
      } else {
        // Créer
        supabase.createEvenement(
          titre,
          supabase.formatDate(new Date(date)),
          desc
        )
          .then(function() {
            console.log('✅ Événement créé');
            modal.classList.remove('show');
            form.reset();
            loadEventsFromSupabase();
            showSuccess('Événement créé avec succès');
          })
          .catch(function(error) {
            console.error('❌ Erreur création:', error);
            showError('Erreur lors de la création: ' + error.message);
          });
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      const d = new Date(dateStr);
      return d.toLocaleDateString('fr-FR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    function formatDateForInput(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function showSuccess(message) {
      const alert = document.getElementById('success-alert');
      alert.textContent = '✓ ' + message;
      alert.classList.add('show');
      setTimeout(() => alert.classList.remove('show'), 3000);
    }

    function showError(message) {
      const alert = document.getElementById('error-alert');
      if (!alert) {
        // Créer l'alerte d'erreur si elle n'existe pas
        const newAlert = document.createElement('div');
        newAlert.id = 'error-alert';
        newAlert.className = 'alert alert-danger';
        document.querySelector('.container').insertBefore(newAlert, document.querySelector('.page-header').nextElementSibling);
        const alert2 = document.getElementById('error-alert');
        alert2.textContent = '✗ ' + message;
        alert2.classList.add('show');
        setTimeout(() => alert2.classList.remove('show'), 4000);
      } else {
        alert.textContent = '✗ ' + message;
        alert.classList.add('show');
        setTimeout(() => alert.classList.remove('show'), 4000);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

        'seminar': 'Séminaire',
        'workshop': 'Atelier',
        'other': 'Autre'
      };
      return map[cat] || cat;
    }

    function showSuccess(message) {
      const alert = document.getElementById('success-alert');
      alert.textContent = '✓ ' + message;
      alert.classList.add('show');
      setTimeout(() => alert.classList.remove('show'), 3000);
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }
  </script>
</body>
</html>
